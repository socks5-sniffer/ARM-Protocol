name: CI Pipeline

on:
  push:
    branches:
      - main
      - CI-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Actions are SHA-pinned to the same commits used by the repo's security
    # scan workflow (github_workflows_ci.yml) for consistency. These are newer
    # majors than the previous mutable @v4 tags (checkout v6, setup-node v6,
    # upload-artifact v7); the build only does npm ci + build + artifact upload,
    # which is unaffected by the major bumps.
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          path: dist/