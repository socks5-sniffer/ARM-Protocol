name: "OWASP Top 10 Security Scan"

on:
  push:
    branches: ["main", "ci-integration-branch"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  dependency-security-scan:
    name: "Dependency Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Enforcing gate: high/critical advisories fail the build. Moderate is left
      # to the advisory JSON report below so a transitive moderate finding does not
      # block unrelated PRs, but a high/critical vuln stops the merge.
      - name: Run npm audit (high/critical — enforcing)
        run: npm audit --audit-level=high

      - name: Run npm audit with JSON output (advisory report)
        run: npm audit --json > npm-audit-report.json
        continue-on-error: true

      - name: Upload npm audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  owasp-dependency-check:
    name: "OWASP Dependency-Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        id: depcheck
        with:
          project: 'ARM-Protocol'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --enableExperimental
            --failOnCVSS 7

      - name: Upload Dependency-Check results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports
          retention-days: 30

  eslint-security:
    name: "ESLint Security Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ESLint security plugins
        run: npm install --save-dev eslint eslint-plugin-security eslint-plugin-no-unsanitized @typescript-eslint/parser

      - name: Create ESLint security config
        run: |
          cat > eslint.config.security.mjs << 'EOF'
          import security from 'eslint-plugin-security';
          import noUnsanitized from 'eslint-plugin-no-unsanitized';
          import tsParser from '@typescript-eslint/parser';

          export default [
            {
              files: ['**/*.{js,jsx,ts,tsx}'],
              languageOptions: {
                parser: tsParser,
                ecmaVersion: 2022,
                sourceType: 'module'
              },
              plugins: {
                security,
                'no-unsanitized': noUnsanitized
              },
              rules: {
                'no-eval': 'error',
                'no-implied-eval': 'error',
                'no-new-func': 'error',
                'security/detect-eval-with-expression': 'error',
                'security/detect-non-literal-regexp': 'warn',
                'security/detect-unsafe-regex': 'error',
                'security/detect-buffer-noassert': 'error',
                'security/detect-child-process': 'warn',
                'security/detect-disable-mustache-escape': 'error',
                'security/detect-no-csrf-before-method-override': 'error',
                'security/detect-non-literal-fs-filename': 'warn',
                'security/detect-non-literal-require': 'warn',
                'security/detect-object-injection': 'warn',
                'security/detect-possible-timing-attacks': 'warn',
                'security/detect-pseudoRandomBytes': 'error',
                'no-unsanitized/method': 'error',
                'no-unsanitized/property': 'error'
              }
            }
          ];
          EOF

      # Report generation stays advisory (artifact only). The gating scan below has
      # no "|| true", so any error-level rule (eval / implied-eval / unsafe-regex /
      # no-unsanitized, etc.) fails the build. server.js is included because it is
      # the key-injecting provider proxy — the most security-sensitive file here.
      - name: Run ESLint security scan (advisory JSON report)
        run: npx eslint --config eslint.config.security.mjs src/ server.js --format json --output-file eslint-security-report.json || true

      - name: Display ESLint results (enforcing — error-level rules fail the build)
        run: npx eslint --config eslint.config.security.mjs src/ server.js

      - name: Upload ESLint security report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: eslint-security-report
          path: eslint-security-report.json
          retention-days: 30

  vite-config-security-check:
    name: "Vite Config Security Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate vite config
        run: |
          echo "Checking vite.config.js for expected proxy/security configuration..."

          if grep -q '"/api/anthropic"' vite.config.js; then
            echo "✓ Anthropic proxy route found"
          else
            echo "✗ Missing /api/anthropic proxy route"
            exit 1
          fi

          if grep -q '"anthropic-version"' vite.config.js; then
            echo "✓ anthropic-version header found"
          else
            echo "✗ Missing anthropic-version header"
            exit 1
          fi

          if grep -q '"anthropic-dangerous-direct-browser-access"' vite.config.js; then
            echo "✓ anthropic-dangerous-direct-browser-access header found"
          else
            echo "✗ Missing anthropic-dangerous-direct-browser-access header"
            exit 1
          fi

          if grep -q '"/api/gemini"' vite.config.js; then
            echo "✓ /api/gemini proxy route found"
          else
            echo "✗ Missing /api/gemini proxy route"
            exit 1
          fi

          # Dev proxy must not be wide-open by default: the hardcoded
          # `allowedHosts: "all"` (DNS-rebinding enabler against the key-injecting
          # proxy) must be gone, replaced by the env-driven allowlist.
          if grep -Eq 'allowedHosts:\s*"all"' vite.config.js; then
            echo "✗ vite.config.js still hardcodes allowedHosts: \"all\""
            exit 1
          else
            echo "✓ allowedHosts is not hardcoded to \"all\""
          fi

          if grep -q 'devProxyAuth' vite.config.js; then
            echo "✓ dev proxy auth guard present"
          else
            echo "✗ Missing dev proxy auth guard (devProxyAuth)"
            exit 1
          fi

          echo "Checking server.js provider proxy hardening..."

          # Broken-access-control protection: every keyed provider route must
          # validate the request model against a per-provider allowlist.
          for token in requireAllowedModel ALLOWED_ANTHROPIC_MODELS ALLOWED_OPENAI_MODELS ALLOWED_GEMINI_MODELS; do
            if grep -q "$token" server.js; then
              echo "✓ server.js: $token present"
            else
              echo "✗ server.js: missing $token"
              exit 1
            fi
          done

          # The /api/* proxy must fail closed when no access token is configured.
          if grep -q 'requireProxyAuth' server.js; then
            echo "✓ server.js: /api proxy auth gate present"
          else
            echo "✗ server.js: missing requireProxyAuth gate"
            exit 1
          fi

          echo "Proxy/config security validation completed successfully."

  secrets-scan:
    name: "Secrets Detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-integrity:
    name: "Build Integrity Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

  security-summary:
    name: "Security Scan Summary"
    runs-on: ubuntu-latest
    needs:
      [
        dependency-security-scan,
        owasp-dependency-check,
        eslint-security,
        vite-config-security-check,
        secrets-scan,
        build-integrity
      ]
    if: always()
    steps:
      - name: Generate security summary
        run: |
          echo "# OWASP Top 10 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP Category | Scan Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| A01:2021 – Broken Access Control | Vite Config Security Validation | ${{ needs.vite-config-security-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| A02:2021 – Cryptographic Failures | Gitleaks (Secrets) | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| A03:2021 – Injection | ESLint Security | ${{ needs.eslint-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| A04:2021 – Insecure Design | Build Integrity Check | ${{ needs.build-integrity.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| A05:2021 – Security Misconfiguration | Vite Config Security Validation | ${{ needs.vite-config-security-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| A06:2021 – Vulnerable Components | npm audit + OWASP DC | ${{ needs.dependency-security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| A07:2021 – Auth Failures | Gitleaks (Secrets) | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| A08:2021 – Software/Data Integrity | Dependency Check | ${{ needs.owasp-dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| A09:2021 – Logging Failures | CodeQL (separate workflow) | N/A |" >> $GITHUB_STEP_SUMMARY
          echo "| A10:2021 – SSRF | ESLint Security | ${{ needs.eslint-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Additional Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeQL** runs separately via the CodeQL workflow" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency scanning** includes npm audit and OWASP Dependency-Check" >> $GITHUB_STEP_SUMMARY
          echo "- **Secret scanning** uses Gitleaks to detect hardcoded credentials" >> $GITHUB_STEP_SUMMARY
          echo "- **Vite config validation** checks expected proxy and request-header configuration" >> $GITHUB_STEP_SUMMARY