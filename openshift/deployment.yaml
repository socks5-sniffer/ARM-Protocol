apiVersion: apps/v1
kind: Deployment
metadata:
  name: arm-protocol
  labels:
    app: arm-protocol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arm-protocol
  template:
    metadata:
      labels:
        app: arm-protocol
    spec:
      containers:
        - name: arm-protocol
          image: quay.io/replace-me/arm-protocol:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: arm-protocol-secrets
          # Auto-saved research traces (/api/save-trace → trace/) must survive
          # pod restarts; without a persistent volume they live in the
          # container's ephemeral filesystem and are lost on every rollout.
          volumeMounts:
            - name: traces
              mountPath: /opt/app-root/src/trace
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: traces
          persistentVolumeClaim:
            claimName: arm-protocol-traces
