apiVersion: v1
kind: Secret
metadata:
  name: arm-protocol-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "replace-with-anthropic-key"
  OPENAI_API_KEY: "replace-with-openai-key"
  GEMINI_API_KEY: "replace-with-gemini-key"
  # REQUIRED: shared secret that gates the /api/* provider proxy. Without it the
  # proxy is disabled (HTTP 503) to prevent anonymous use of the keys above.
  # Generate with: openssl rand -hex 32
  ARM_ACCESS_TOKEN: "replace-with-long-random-shared-secret"
  # Trusted reverse proxies in front of the pod (OpenShift edge route = 1).
  TRUSTED_PROXY_COUNT: "1"
